<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeshia – Montajes Fotorrealistas Oficiales & Suite de Etiquetas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #f4f2ed;
      --panel-bg: #ffffff;
      --text-dark: #22201d;
      --text-muted: #78736a;
      --accent-copper: #c2825c;
      --border-light: #e2ded4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-app);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-light);
      padding: 1rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .brand-header { display: flex; align-items: center; gap: 1.2rem; }
    .brand-logo-img { height: 48px; object-fit: contain; }

    .brand-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-dark);
    }
    .brand-header span {
      font-size: 0.75rem;
      color: var(--accent-copper);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      display: block;
    }

    .view-switcher-tabs {
      display: flex;
      background: #eeeae0;
      padding: 4px;
      border-radius: 30px;
    }

    .tab-btn {
      border: none; background: transparent;
      padding: 0.6rem 1.4rem;
      font-size: 0.82rem; font-weight: 700;
      border-radius: 25px; cursor: pointer;
      transition: all 0.25s ease; color: var(--text-muted);
      display: flex; align-items: center; gap: 0.5rem;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--text-dark);
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .btn-nav-manual {
      background: #f0ebe1; color: var(--text-dark); text-decoration: none;
      padding: 0.55rem 1.2rem; border-radius: 25px; font-size: 0.8rem; font-weight: 600;
      transition: all 0.2s; border: 1px solid var(--border-light);
    }
    .btn-nav-manual:hover { background: var(--accent-copper); color: white; }

    /* CONTROLS BAR */
    .controls-bar {
      display: flex; flex-wrap: wrap; gap: 1.2rem; align-items: center;
      background: #ffffff; padding: 1rem 2.5rem; border-bottom: 1px solid var(--border-light);
    }

    .control-group { display: flex; align-items: center; gap: 0.6rem; }
    .control-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; color: var(--text-muted); text-transform: uppercase; }

    .select-input {
      padding: 0.5rem 1rem; border-radius: 20px; border: 1px solid var(--border-light);
      background: #ffffff; font-size: 0.82rem; font-family: inherit; color: var(--text-dark);
      outline: none; cursor: pointer;
    }

    /* MAIN */
    main {
      flex: 1; padding: 2.5rem; max-width: 1750px; margin: 0 auto; width: 100%;
    }

    .section-banner {
      background: #ffffff; border-radius: 16px; padding: 1.4rem 2rem; margin-bottom: 2rem;
      border: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between;
    }
    .section-banner h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 500; }
    .section-banner p { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem; }

    /* MONTAJES GRID - PURE CLEAN HIGH-RES IMAGES ONLY */
    .montajes-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 2.5rem;
    }

    .montage-card {
      background: #ffffff; border-radius: 22px; padding: 1.4rem;
      border: 1px solid var(--border-light); display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03); transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    .montage-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.08); }

    .montage-stage-box {
      width: 100%; height: 460px;
      border-radius: 16px; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: #FAF8F5; border: 1px solid #EFECE4;
    }

    .montage-full-img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s ease;
    }
    .montage-card:hover .montage-full-img { transform: scale(1.03); }

    .montage-card-info {
      width: 100%; margin-top: 1.2rem; display: flex; justify-content: space-between; align-items: center;
      padding: 0 0.4rem;
    }
    .montage-card-info h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.55rem; font-weight: 600; color: var(--text-dark); }
    .montage-card-info p { font-size: 0.78rem; color: var(--accent-copper); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    /* PLANOS ETIQUETAS GRID */
    .labels-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 2.5rem; align-items: start;
    }

    .label-card {
      background: #ffffff; border-radius: 20px; padding: 1.8rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.03); border: 1px solid var(--border-light);
      display: flex; flex-direction: column; align-items: center;
    }
    .card-top-meta {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.2rem; border-bottom: 1px dashed var(--border-light); padding-bottom: 0.7rem;
    }
    .badge-envase { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.3rem 0.8rem; border-radius: 20px; }
    .badge-mikado { background: #EBF3F5; color: #2C5E6B; }
    .badge-spray { background: #FDF0E9; color: #B8562B; }
    .badge-aromatizador { background: #FAF3E6; color: #8A6529; }
    .badge-recarga250 { background: #EBF5ED; color: #2E6B3A; }
    .badge-recarga500 { background: #F3EBF5; color: #6B2E69; }

    .dim-tag { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); background: #f4f0e8; padding: 0.25rem 0.7rem; border-radius: 8px; }

    .card-display-body { width: 100%; display: flex; gap: 1.5rem; align-items: center; justify-content: center; }

    .container-photo-box {
      width: 140px; height: 240px; background: #FAF8F5; border-radius: 12px; border: 1px solid #EBE6DC;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0.5rem;
    }
    .container-photo-img { max-width: 100%; max-height: 190px; object-fit: contain; }

    /* ETIQUETAS VECTORIALES */
    .etiqueta-wrap {
      background: #FAF8F5; border: 1px solid #E2DCCF; color: #2A2723;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      text-align: center; position: relative; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }
    .etiqueta-wrap::before {
      content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px;
      border: 1px solid rgba(194, 130, 92, 0.45); pointer-events: none;
    }

    .etiqueta-wrap.envase-mikado { width: 250px; height: 130px; padding: 0.7rem 0.9rem; border-radius: 3px; }
    .etiqueta-wrap.envase-mikado .logo-hero-img { max-width: 110px; max-height: 52px; object-fit: contain; }

    .etiqueta-wrap.envase-aromatizador { width: 155px; height: 180px; border-radius: 50% / 48%; padding: 1.3rem 0.8rem; }
    .etiqueta-wrap.envase-aromatizador::before { border-radius: 50% / 48%; top: 6px; left: 6px; right: 6px; bottom: 6px; }
    .etiqueta-wrap.envase-aromatizador .logo-hero-img { max-width: 95px; max-height: 55px; object-fit: contain; }

    .etiqueta-wrap.envase-spray { width: 220px; height: 300px; padding: 1.4rem 1.1rem; border-radius: 3px; }
    .etiqueta-wrap.envase-spray .logo-hero-img { max-width: 135px; max-height: 75px; object-fit: contain; }

    .etiqueta-wrap.envase-recarga250 { width: 210px; height: 360px; padding: 1.6rem 1.2rem; border-radius: 4px; }
    .etiqueta-wrap.envase-recarga250 .logo-hero-img { max-width: 140px; max-height: 80px; object-fit: contain; }

    .etiqueta-wrap.envase-recarga500 { width: 240px; height: 420px; padding: 1.8rem 1.3rem; border-radius: 5px; }
    .etiqueta-wrap.envase-recarga500 .logo-hero-img { max-width: 155px; max-height: 90px; object-fit: contain; }

    .brand-subhead { font-size: 0.5rem; letter-spacing: 0.22em; text-transform: uppercase; color: #8c8273; margin-top: 2px; }
    .aroma-title { font-family: 'Cormorant Garamond', serif; font-weight: 700; text-transform: uppercase; line-height: 1.1; color: #23201B; }
    .aroma-cat { font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-copper); font-weight: 700; }
    .notes-box { font-size: 0.58rem; font-style: italic; color: #555046; line-height: 1.3; margin: 0.25rem 0; }
    .label-contact-footer { font-size: 0.48rem; letter-spacing: 0.05em; color: #554f46; border-top: 1px solid rgba(0,0,0,0.12); padding-top: 0.25rem; margin-top: 0.25rem; width: 100%; }

    /* LIGHTBOX MODAL FOR HD INSPECTION */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      z-index: 1000; display: none; align-items: center; justify-content: center;
      padding: 2rem;
    }
    .modal-content {
      max-width: 90vw; max-height: 90vh; background: #ffffff; border-radius: 20px;
      overflow: hidden; display: flex; flex-direction: column; position: relative;
    }
    .modal-img { max-width: 85vw; max-height: 78vh; object-fit: contain; background: #FAF8F5; }
    .modal-close-btn {
      position: absolute; top: 15px; right: 20px; background: rgba(0,0,0,0.6); color: white;
      border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer;
    }
    .modal-footer { padding: 1rem 1.5rem; text-align: center; background: white; font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand-header">
      <img src="../assets/logos/Original_Transparent.png" alt="Logo Jeshia" class="brand-logo-img">
      <div>
        <h1>JESHIA</h1>
        <span>Home & Aromas • Galería de Montajes Limpia</span>
      </div>
    </div>
    
    <div class="view-switcher-tabs">
      <button class="tab-btn active" id="tabMontajes" onclick="switchView('montajes')">🍾 Montajes Oficiales</button>
      <button class="tab-btn" id="tabEtiquetas" onclick="switchView('etiquetas')">🏷️ Planos de Etiquetas</button>
    </div>

    <div>
      <a href="manual_logo.html" class="btn-nav-manual">📖 Manual del Logo</a>
      <button class="btn-nav-manual" style="background: var(--accent-copper); color: white;" onclick="window.print()">🖨️ Imprimir</button>
    </div>
  </header>

  <!-- CONTROLS BAR -->
  <div class="controls-bar">
    <div class="control-group">
      <span class="control-label">FILTRAR PRODUCTO:</span>
      <select class="select-input" id="envaseSelect" onchange="setEnvaseFilter(this.value)">
        <option value="all">Ver Todos los Productos (Mikado, Home Spray, Aromatizador, Recargas)</option>
        <option value="mikado">Mikado (Mikado Montaje.png)</option>
        <option value="spray">Home Spray (Home Spray Montaje.png)</option>
        <option value="aromatizador">Aromatizador (Aromatizador Montaje.png)</option>
        <option value="recarga250">Recarga 250 ml (Recarga 250 Montaje.png)</option>
        <option value="recarga500">Recarga 500 ml (Recarga 500 Montaje.png)</option>
      </select>
    </div>

    <div class="control-group" id="aromaGroupContainer">
      <span class="control-label">SELECCIONAR AROMA (PLANOS):</span>
      <select class="select-input" id="aromaSelect" onchange="setAromaFilter(this.value)">
        <option value="vainilla-coco">Vainilla Coco</option>
        <option value="citric">Citric</option>
        <option value="berries">Berries</option>
        <option value="coco-nut">Coco Nut</option>
        <option value="sugar">Sugar</option>
        <option value="chicle">Chicle</option>
        <option value="manzana-canela">Manzana Canela</option>
        <option value="coco-flower">Coco Flower</option>
        <option value="mokka">Mokka</option>
        <option value="limon">Limón</option>
        <option value="pino">Pino</option>
        <option value="lavanda">Lavanda</option>
        <option value="frutal-mango">Frutal Mango</option>
      </select>
    </div>
  </div>

  <!-- MAIN -->
  <main>
    <div class="section-banner" id="sectionBanner">
      <div>
        <h2 id="bannerTitle">Galería Oficial de Montajes Jeshia</h2>
        <p id="bannerDesc">Imágenes oficiales de los envases reales con sus etiquetas aplicadas (Mikado, Home Spray, Aromatizador y Recargas 250/500).</p>
      </div>
    </div>

    <!-- VIEW 1: MONTAJES EN ENVASE REAL (IMÁGENES LIMPIAS SIN ETIQUETAS SUPERPUESTAS) -->
    <div class="montajes-grid" id="montajesView"></div>

    <!-- VIEW 2: PLANOS DE ETIQUETAS (OCULTO POR DEFECTO) -->
    <div class="labels-grid" id="labelsView" style="display: none;"></div>
  </main>

  <!-- LIGHTBOX MODAL -->
  <div class="modal-overlay" id="imageModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      <img src="" alt="Montaje Ampliado" class="modal-img" id="modalImg">
      <div class="modal-footer" id="modalFooter">Montaje HD Jeshia</div>
    </div>
  </div>

  <script>
    const aromasData = {
      "citric": { name: "Citric", sub: "Cítricos Frescos & Bergamota", notes: "Naranja dulzona, bergamota y verbena." },
      "berries": { name: "Berries", sub: "Frutos Rojos & Silvestres", notes: "Frambuesa silvestre, arándanos y moras." },
      "coco-nut": { name: "Coco Nut", sub: "Nuez de Coco & Crema", notes: "Coco tostado, leche suave y vainilla." },
      "sugar": { name: "Sugar", sub: "Azúcar Dulce & Caramelo", notes: "Cristales de azúcar, algodón dulce y caramelo." },
      "chicle": { name: "Chicle", sub: "Bubblegum & Dulce Infancia", notes: "Chicle rosa clásico y notas frutales." },
      "manzana-canela": { name: "Manzana Canela", sub: "Manzana Asada & Canela", notes: "Manzana horneada y canela especiada." },
      "coco-flower": { name: "Coco Flower", sub: "Flor de Coco & Jazmín", notes: "Flor de coco y pétalos de jazmín blanco." },
      "mokka": { name: "Mokka", sub: "Café Moka & Cacao Tostado", notes: "Grano de café espresso y cacao artesanal." },
      "limon": { name: "Limón", sub: "Limón Verde & Hierba Luisa", notes: "Limón recién cortado y hierba luisa." },
      "pino": { name: "Pino", sub: "Pino Silvestre & Bosque", notes: "Agujas de pino, madera de cedro y aire puro." },
      "lavanda": { name: "Lavanda", sub: "Lavanda Francesa & Manzanilla", notes: "Lavanda silvestre y flor de manzanilla." },
      "frutal-mango": { name: "Frutal Mango", sub: "Mango Tropical & Maracuyá", notes: "Néctar de mango maduro y maracuyá." },
      "vainilla-coco": { name: "Vainilla Coco", sub: "Vainilla Bourbon & Coco", notes: "Vainilla Bourbon natural y crema de coco." }
    };

    // EXACT USER PROVIDED MONTAJE IMAGE PATHS
    const envasesSpecs = {
      "mikado": {
        name: "Mikado",
        dim: "50 x 25 mm",
        montageImg: "../assets/envases/Mikado/Mikado Montaje.png",
        thumbImg: "../assets/envases/thumbs/mikado_montaje.jpg",
        flatThumb: "../assets/envases/Mikado/Mikado Original.png",
        category: "DIFUSOR DE VARILLAS",
        volume: "200 ml"
      },
      "spray": {
        name: "Home Spray",
        dim: "60 x 75 mm",
        montageImg: "../assets/envases/Home Spray/Home Spray Montaje.png",
        thumbImg: "../assets/envases/thumbs/homespray_montaje.jpg",
        flatThumb: "../assets/envases/Home Spray/Home Spray Original.png",
        category: "SPRAY DE AMBIENTE",
        volume: "250 ml"
      },
      "aromatizador": {
        name: "Aromatizador",
        dim: "15 x 20 mm (Circular)",
        montageImg: "../assets/envases/Aromatizador/Aromatizador Montaje.png",
        thumbImg: "../assets/envases/thumbs/aromatizador_montaje.jpg",
        flatThumb: "../assets/envases/Aromatizador/Back.png",
        category: "AMBIENTADOR",
        volume: "15 ml"
      },
      "recarga250": {
        name: "Recarga 250 ml",
        dim: "60 x 100 mm",
        montageImg: "../assets/envases/Recargas/Recarga 250 Montaje.png",
        thumbImg: "../assets/envases/thumbs/recarga250_montaje.jpg",
        flatThumb: "../assets/envases/Recargas/Recarga 250.png",
        category: "RECARGA ECO 250ML",
        volume: "250 ml"
      },
      "recarga500": {
        name: "Recarga 500 ml",
        dim: "75 x 130 mm",
        montageImg: "../assets/envases/Recargas/Recarga 500 Montaje.png",
        thumbImg: "../assets/envases/thumbs/recarga500_montaje.jpg",
        flatThumb: "../assets/envases/Recargas/Recarga 500.png",
        category: "RECARGA FAMILIAR 500ML",
        volume: "500 ml"
      }
    };

    let activeView = 'montajes';
    let currentEnvase = 'all';
    let currentAroma = 'vainilla-coco';

    function renderView() {
      const aroma = aromasData[currentAroma];
      const envasesKeys = currentEnvase === 'all' ? ['mikado', 'spray', 'aromatizador', 'recarga250', 'recarga500'] : [currentEnvase];

      if (activeView === 'montajes') {
        document.getElementById('montajesView').style.display = 'grid';
        document.getElementById('labelsView').style.display = 'none';

        const montajesContainer = document.getElementById('montajesView');
        montajesContainer.innerHTML = '';

        envasesKeys.forEach(envaseKey => {
          montajesContainer.appendChild(createCleanMontageCard(envaseKey));
        });
      } else {
        document.getElementById('montajesView').style.display = 'none';
        document.getElementById('labelsView').style.display = 'grid';

        const labelsContainer = document.getElementById('labelsView');
        labelsContainer.innerHTML = '';

        envasesKeys.forEach(envaseKey => {
          labelsContainer.appendChild(createLabelCard(envaseKey, aroma));
        });
      }
    }

    // PURE CLEAN MONTAGE CARD: NO OVERLAID HTML BADGES AT ALL!
    function createCleanMontageCard(envaseKey) {
      const card = document.createElement('div');
      card.className = 'montage-card';
      const spec = envasesSpecs[envaseKey];

      card.onclick = () => openModal(spec.montageImg, `Montaje Oficial Jeshia – ${spec.name}`);

      card.innerHTML = `
        <div class="montage-stage-box">
          <img src="${spec.thumbImg}" alt="${spec.name}" class="montage-full-img">
        </div>

        <div class="montage-card-info">
          <div>
            <h3>${spec.name}</h3>
            <p>Formato ${spec.dim}</p>
          </div>
          <span style="font-size:0.75rem; color:var(--text-muted); background:#f4f0e8; padding:0.35rem 0.8rem; border-radius:8px; font-weight:600;">Ver HD 🔍</span>
        </div>
      `;

      return card;
    }

    function createLabelCard(envaseKey, aroma) {
      const card = document.createElement('div');
      card.className = 'label-card';
      const spec = envasesSpecs[envaseKey];

      const isMikado = envaseKey === 'mikado';
      const isAromatizador = envaseKey === 'aromatizador';
      const isSpray = envaseKey === 'spray';

      let notesContent = '';
      let footerContent = '';

      if (isAromatizador) {
        notesContent = ''; footerContent = '';
      } else if (isMikado) {
        notesContent = ''; footerContent = '';
      } else if (isSpray) {
        notesContent = `<div class="notes-box">${aroma.notes}</div>`;
        footerContent = `
          <div class="label-contact-footer">
            <div><strong>WhatsApp:</strong> +569 31141134 | <strong>TikTok:</strong> @jeshiacybn</div>
          </div>
        `;
      } else {
        notesContent = `<div class="notes-box">${aroma.notes}<br><em>Fórmula concentrada eco-amigable.</em></div>`;
        footerContent = `
          <div class="label-contact-footer">
            <div><strong>WhatsApp:</strong> +569 31141134 | +569 3362 0641</div>
            <div><strong>TikTok:</strong> @jeshiacybn • Contenido: ${spec.volume}</div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="card-top-meta">
          <span class="badge-envase badge-${envaseKey}">${spec.name}</span>
          <span class="dim-tag">${spec.dim}</span>
        </div>

        <div class="card-display-body">
          <div class="container-photo-box">
            <img src="${spec.flatThumb}" alt="Envase Real ${spec.name}" class="container-photo-img">
            <span class="container-photo-label">ENVASE EXACTO</span>
          </div>

          <div class="etiqueta-wrap envase-${envaseKey}">
            <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
              <img src="../assets/logos/Original_Transparent.png" alt="Logo Jeshia" class="logo-hero-img">
              <div class="brand-subhead">HOME & AROMAS</div>
            </div>

            <div style="width:100%;">
              <span class="aroma-cat">${spec.category}</span>
              <h3 class="aroma-title">${aroma.name}</h3>
              ${notesContent}
            </div>

            ${footerContent}
          </div>
        </div>
      `;

      return card;
    }

    function switchView(view) {
      activeView = view;
      document.querySelectorAll('.view-switcher-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      if (view === 'montajes') {
        document.getElementById('tabMontajes').classList.add('active');
        document.getElementById('bannerTitle').innerText = "Galería Oficial de Montajes Jeshia";
        document.getElementById('bannerDesc').innerText = "Imágenes oficiales de los envases reales con sus etiquetas aplicadas (Mikado, Home Spray, Aromatizador y Recargas 250/500).";
      } else {
        document.getElementById('tabEtiquetas').classList.add('active');
        document.getElementById('bannerTitle').innerText = "Planos e Impresión de Etiquetas Vectoriales";
        document.getElementById('bannerDesc').innerText = "El logo Original_Transparent ocupa el máximo protagonismo sin distorsionar su proporción 1:1. Cantidad de textos ajustada rigurosamente según el tamaño físico de cada etiqueta.";
      }
      renderView();
    }

    function openModal(imgSrc, title) {
      document.getElementById('modalImg').src = imgSrc;
      document.getElementById('modalFooter').innerText = title;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    function setEnvaseFilter(val) { currentEnvase = val; renderView(); }
    function setAromaFilter(val) { currentAroma = val; renderView(); }

    window.addEventListener('DOMContentLoaded', renderView);
  </script>
</body>
</html>
